<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aman Maurya — Mechanical Design Portfolio</title>
    <meta name="description" content="Mechanical Design Engineering portfolio and CMS dashboard of Aman Maurya showcasing CAD models, engineering projects, expertise, and credentials." />
    <meta property="og:title" content="Aman Maurya — Mechanical Design Portfolio" />
    <meta property="og:description" content="Mechanical Design Engineering portfolio and CMS dashboard of Aman Maurya showcasing CAD models, engineering projects, expertise, and credentials." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Font Awesome Icons for portfolio compatibility -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <script>
      (function() {
        try {
          localStorage.removeItem('theme');
          localStorage.removeItem('portfolio_theme');
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <!-- SPA Redirect restoration for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
